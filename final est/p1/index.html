<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form id="registrationForm">
            <h2>Student Registration Form</h2>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" placeholder="1234567890" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="radio-group">
                    <input type="radio" name="gender" id="male"> <label for="male">Male</label>
                    <input type="radio" name="gender" id="female"> <label for="female">Female</label>
                </div>
            </div>

            <div class="form-group">
                <label>Course</label>
                <select>
                    <option value="">Select Course</option>
                    <option value="cs">Computer Science</option>
                    <option value="it">Information Technology</option>
                    <option value="ee">Electrical Engineering</option>
                </select>
            </div>

            <div class="form-group">
                <label>Skills</label>
                <div class="checkbox-group">
                    <input type="checkbox" id="html"> <label for="html">HTML</label>
                    <input type="checkbox" id="css"> <label for="css">CSS</label>
                    <input type="checkbox" id="js"> <label for="js">JavaScript</label>
                </div>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea rows="4" placeholder="Your address..."></textarea>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-submit">Submit</button>
                <button type="reset" class="btn-reset">Reset</button>
            </div>
        </form>
    </div>
</body>
</html>
